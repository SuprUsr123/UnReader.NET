name: Build and release

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    outputs:
      release_tag: ${{ steps.prepare.outputs.tag }}
      release_version: ${{ steps.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    environment:
      name: Build & Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Prepare release version
        id: prepare
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: python .github/scripts/prepare-release.py
      - name: Publish Windows app
        if: matrix.platform == 'windows'
        env:
          UNREADER_SERVER_URL: ${{ vars.UNREADER_SERVER_URL }}
          UNREADER_JWT_SECRET: ${{ secrets.UNREADER_JWT_SECRET }}
          UNREADER_RUNTIME_IDENTIFIER: win-x64
          UNREADER_SELF_CONTAINED: 'true'
        run: bash ./build-release.sh --windows
      - name: Package Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path ./release/windows/* -DestinationPath "./UnReader.NET-$($env:BUILD_LABEL)-windows-x64.zip"
      - name: Publish Linux apps
        if: matrix.platform == 'linux'
        env:
          UNREADER_SERVER_URL: ${{ vars.UNREADER_SERVER_URL }}
          UNREADER_JWT_SECRET: ${{ secrets.UNREADER_JWT_SECRET }}
          UNREADER_RUNTIME_IDENTIFIER: linux-x64
          UNREADER_SELF_CONTAINED: 'true'
        run: bash ./build-release.sh --linux
      - name: Package Linux apps
        if: matrix.platform == 'linux'
        run: tar -czf "UnReader.NET-${BUILD_LABEL}-linux-x64.tar.gz" -C release linux linux-runner
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: UnReader.NET-*-${{ matrix.platform }}-*
          if-no-files-found: error

  release:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: UnReader.NET ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          files: UnReader.NET-${{ needs.build.outputs.release_tag }}-*
